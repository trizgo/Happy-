<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Wish 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at 20% 10%,#7b2ff7 0,transparent 45%),radial-gradient(circle at 80% 90%,#f107a3 0,transparent 45%),#1a0b2e;overflow-x:hidden}
.stage{display:none;min-height:100vh;padding:24px 16px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage.on{display:flex;animation:fade .7s}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
h1,h2{font-family:'Pacifico',cursive;font-weight:400}
input,textarea{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font:inherit;outline:none}
input::placeholder,textarea::placeholder{color:#ffffffaa}
label{display:block;text-align:left;font-size:14px;margin-top:10px;opacity:.9}
button,.btn{cursor:pointer;border:0;border-radius:30px;padding:12px 26px;font:600 16px 'Hind Siliguri';color:#fff;background:linear-gradient(135deg,#ff6ec4,#7873f5);box-shadow:0 8px 20px rgba(255,110,196,.4);margin:8px 4px;transition:.2s}
button:hover{transform:translateY(-2px) scale(1.03)}
button.sm{padding:6px 14px;font-size:13px;margin:2px}
.err{color:#ffb3c1;min-height:20px;font-size:14px}
/* admin */
#admin .card{max-width:560px;text-align:left}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff22;font-size:14px}
.prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.prev img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.link{word-break:break-all;background:#0004;padding:10px;border-radius:10px;margin:8px 0;font-size:14px}
/* cake */
.cake{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.tier{border-radius:14px 14px 6px 6px;position:relative;opacity:0;transform:translateY(-320px);box-shadow:inset 0 -8px 0 #0002}
.tier::before{content:"";position:absolute;top:0;left:0;right:0;height:16px;border-radius:14px 14px 40% 40%;background:#fff;opacity:.92}
.t3{width:130px;height:46px;background:#ff8fb1}.t2{width:190px;height:56px;background:#c58bff}.t1{width:250px;height:66px;background:#ffb86b}
.plate{width:290px;height:12px;border-radius:50%;background:#e8e8f5;opacity:0}
.build .tier,.build .plate{animation:drop .7s cubic-bezier(.3,1.4,.5,1) forwards}
.build .t1{animation-delay:.2s}.build .t2{animation-delay:1s}.build .t3{animation-delay:1.8s}.build .plate{animation:fade .5s forwards}
@keyframes drop{to{opacity:1;transform:none}}
.candles{display:flex;gap:16px;height:70px;align-items:flex-end;justify-content:center}
.candle{width:10px;height:38px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,#ff6ec4 6px 12px);position:relative;cursor:pointer;animation:cdrop .6s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes cdrop{from{transform:translateY(-200px);opacity:0}}
.candle::before{content:"";position:absolute;inset:-14px -14px 0}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(#fff 10%,#ffd23f 45%,#ff7a00);box-shadow:0 0 18px 6px #ffb34777;animation:flick .25s infinite alternate;transform-origin:bottom}
@keyframes flick{to{transform:scale(1.1,.93) rotate(3deg)}}
.candle.off .flame{display:none}
.candle.off::after{content:"";position:absolute;left:50%;top:-10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff8;animation:smoke 1.6s forwards}
@keyframes smoke{to{transform:translateY(-60px) scale(5);opacity:0}}
/* notes */
.note{background:#fffbe8;color:#4a3b2a;padding:16px 18px;border-radius:6px;margin:12px auto;max-width:420px;box-shadow:0 8px 20px #0004;font-size:19px;line-height:1.6;opacity:0;animation:fade .8s forwards;position:relative}
.note:nth-child(odd){transform:rotate(-1.5deg)}.note:nth-child(even){transform:rotate(1.5deg)}
/* gallery */
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 18px;max-width:900px;padding:20px 0}
.pol{background:#fff;padding:10px 10px 34px;width:min(240px,42vw);box-shadow:0 12px 28px #0006;position:relative;opacity:0;animation:pop .8s cubic-bezier(.3,1.4,.5,1) forwards}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:#ffd6e8cc;transform:rotate(-4deg)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(0)}to{opacity:1;transform:rotate(var(--r))}}
.pol{transform:rotate(var(--r))}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.big{font-size:clamp(34px,9vw,60px);line-height:1.3;text-shadow:0 4px 20px #f107a3}
.hint{opacity:.85;margin:10px;min-height:24px}
</style>
</head>
<body>

<!-- ===== ADMIN ===== -->
<div id="adminLogin" class="stage">
  <div class="card">
    <h2 style="font-size:30px">🔐 Admin Login</h2>
    <input id="em" type="email" placeholder="Gmail">
    <input id="pw" type="password" placeholder="Password">
    <div class="err" id="lerr"></div>
    <button id="loginBtn">Login</button>
  </div>
</div>

<div id="admin" class="stage" style="justify-content:flex-start">
  <div class="card">
    <div class="row" style="border:0"><h2 style="font-size:26px">🎂 Dashboard</h2><button class="sm" id="logout">Logout</button></div>
    <label>যার জন্মদিন (নাম) — ঐচ্ছিক</label><input id="aName" placeholder="যেমন: রিয়া">
    <label>জন্মদিনের তারিখ — ঐচ্ছিক</label><input id="aDate" type="date">
    <label>নোট (প্রতি লাইনে একটি করে নোট)</label><textarea id="aNotes" rows="5" placeholder="শুভ জন্মদিন! 🎉&#10;তুমি অনেক স্পেশাল..."></textarea>
    <label>ছবি (একাধিক বাছাই করা যাবে)</label><input id="aPhotos" type="file" accept="image/*" multiple>
    <div class="prev" id="prev"></div>
    <label>পাসওয়ার্ড লক (ফাঁকা রাখলে লক থাকবে না)</label><input id="aPass" placeholder="ঐচ্ছিক পাসওয়ার্ড">
    <div class="err" id="aerr"></div>
    <button id="save">✨ লিংক তৈরি করো</button>
    <div id="result"></div>
    <h3 style="margin-top:20px">আগের লিংকগুলো</h3>
    <div id="list"></div>
  </div>
</div>

<!-- ===== VIEWER ===== -->
<div id="vLoad" class="stage"><h2>🎁 লোড হচ্ছে...</h2></div>
<div id="vErr" class="stage"><h2>😕 লিংকটি পাওয়া যায়নি</h2></div>

<div id="vCake" class="stage">
  <h2 id="vTitle" class="big" style="margin-bottom:6px"></h2>
  <div class="cake" id="cake">
    <div class="candles" id="candles"></div>
    <div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="card" id="lock" style="display:none;max-width:340px">
    <div style="font-size:20px">🔒 পাসওয়ার্ড দাও</div>
    <input id="lpw" type="password" placeholder="পাসওয়ার্ড">
    <div class="err" id="lock-err"></div>
    <button id="unlock">আনলক করো</button>
  </div>
  <button id="toNotes" style="display:none">পরবর্তী ➜</button>
</div>

<div id="vNotes" class="stage"><h2 style="font-size:32px;margin-bottom:10px">💌 তোমার জন্য কিছু কথা</h2><div id="notes"></div><button id="toPhotos">পরবর্তী ➜</button></div>
<div id="vPhotos" class="stage"><h2 style="font-size:32px">📸 মধুর স্মৃতি</h2><div class="gal" id="gal"></div><button id="toEnd">পরবর্তী ➜</button></div>
<div id="vEnd" class="stage"><div class="big" style="font-family:Pacifico">Happy Birthday</div><div class="big" id="endName" style="margin:10px 0"></div><div id="endDate" style="font-size:20px"></div><div style="font-size:60px;margin-top:14px">🎂🎉💖</div><button id="replay">🔁 আবার দেখো</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBXTX7h1kKT7B5HSzbhKSqwyqfD8tZ76f8",
  authDomain: "happy-1f92d.firebaseapp.com",
  projectId: "happy-1f92d",
  storageBucket: "happy-1f92d.firebasestorage.app",
  messagingSenderId: "951183033864",
  appId: "1:951183033864:web:ae7afe42a406518fb8f3bd"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const show = id => { document.querySelectorAll('.stage').forEach(e => e.classList.remove('on')); $('#' + id).classList.add('on'); scrollTo(0, 0); };
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
const baseLink = id => location.origin + location.pathname + '?w=' + id;

/* ================= ROUTER ================= */
const wid = new URLSearchParams(location.search).get('w');
if (wid) viewer(wid); else adminInit();

/* ================= ADMIN ================= */
function adminInit() {
  show('adminLogin');
  onAuthStateChanged(auth, u => { if (u) { show('admin'); loadList(); } else show('adminLogin'); });
  $('#loginBtn').onclick = async () => {
    $('#lerr').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
    catch (e) { $('#lerr').textContent = 'ইমেইল বা পাসওয়ার্ড ভুল!'; }
  };
  $('#logout').onclick = () => signOut(auth);
  let photos = [];
  $('#aPhotos').onchange = async e => {
    photos = []; $('#prev').innerHTML = '';
    for (const f of e.target.files) {
      const d = await resize(f); photos.push(d);
      const i = new Image(); i.src = d; $('#prev').append(i);
    }
  };
  $('#save').onclick = async () => {
    const btn = $('#save'); $('#aerr').textContent = '';
    const notes = $('#aNotes').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!notes.length && !photos.length) { $('#aerr').textContent = 'অন্তত একটি নোট বা ছবি দাও।'; return; }
    btn.disabled = true; btn.textContent = 'সেভ হচ্ছে...';
    try {
      const id = [...crypto.getRandomValues(new Uint8Array(6))].map(b => (b % 36).toString(36)).join('');
      const pass = $('#aPass').value.trim();
      await setDoc(doc(db, 'wishes', id), {
        name: $('#aName').value.trim(), date: $('#aDate').value, notes,
        pwHash: pass ? await sha(pass) : '', createdAt: Date.now()
      });
      for (let i = 0; i < photos.length; i++) await addDoc(collection(db, 'wishes', id, 'photos'), { data: photos[i], i });
      $('#result').innerHTML = '<div class="link" id="lk"></div><button class="sm" id="cp">📋 কপি করো</button>';
      $('#lk').textContent = baseLink(id);
      $('#cp').onclick = () => { navigator.clipboard.writeText(baseLink(id)); $('#cp').textContent = '✅ কপি হয়েছে'; };
      loadList();
    } catch (e) { $('#aerr').textContent = 'সমস্যা: ' + e.message; }
    btn.disabled = false; btn.textContent = '✨ লিংক তৈরি করো';
  };
}
function resize(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .7)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function loadList() {
  const l = $('#list'); l.innerHTML = '';
  const snap = await getDocs(query(collection(db, 'wishes'), orderBy('createdAt', 'desc')));
  snap.forEach(d => {
    const w = d.data(), r = document.createElement('div'); r.className = 'row';
    const t = document.createElement('span'); t.textContent = (w.name || 'নামহীন') + (w.pwHash ? ' 🔒' : '');
    const b = document.createElement('span');
    const c = document.createElement('button'); c.className = 'sm'; c.textContent = 'লিংক';
    c.onclick = () => { navigator.clipboard.writeText(baseLink(d.id)); c.textContent = '✅'; };
    const x = document.createElement('button'); x.className = 'sm'; x.textContent = '🗑';
    x.onclick = async () => {
      if (!confirm('মুছে ফেলবে?')) return;
      const ph = await getDocs(collection(db, 'wishes', d.id, 'photos'));
      for (const p of ph.docs) await deleteDoc(p.ref);
      await deleteDoc(d.ref); loadList();
    };
    b.append(c, x); r.append(t, b); l.append(r);
  });
}

/* ================= VIEWER ================= */
async function viewer(id) {
  show('vLoad');
  let w, photos = [];
  try {
    const s = await getDoc(doc(db, 'wishes', id));
    if (!s.exists()) return show('vErr');
    w = s.data();
    const ps = await getDocs(collection(db, 'wishes', id, 'photos'));
    photos = ps.docs.map(d => d.data()).sort((a, b) => a.i - b.i).map(p => p.data);
  } catch (e) { return show('vErr'); }

  const start = () => {
    $('#vTitle').textContent = w.name ? '🎂 ' + w.name : '';
    $('#candles').innerHTML = ''; $('#hint').textContent = '';
    $('#lock').style.display = 'none'; $('#toNotes').style.display = 'none';
    const cake = $('#cake'); cake.classList.remove('build'); void cake.offsetWidth; cake.classList.add('build');
    show('vCake');
    setTimeout(() => w.pwHash ? ($('#lock').style.display = 'block') : candles(), 2900);
  };
  const candles = () => {
    const box = $('#candles'); let left = 5;
    $('#hint').textContent = '🕯️ মোমবাতিগুলোতে ক্লিক করে নিভিয়ে দাও';
    for (let i = 0; i < 5; i++) {
      const c = document.createElement('div'); c.className = 'candle'; c.style.animationDelay = i * .15 + 's';
      c.innerHTML = '<div class="flame"></div>';
      c.onclick = () => {
        if (c.classList.contains('off')) return; c.classList.add('off');
        if (--left === 0) { $('#hint').textContent = '🎉 শুভ জন্মদিন! 🎉'; confetti(); $('#toNotes').style.display = 'inline-block'; }
      };
      box.append(c);
    }
  };
  $('#unlock').onclick = async () => {
    if (await sha($('#lpw').value.trim()) === w.pwHash) { $('#lock').style.display = 'none'; candles(); }
    else { $('#lock-err').textContent = 'ভুল পাসওয়ার্ড, আবার চেষ্টা করো'; }
  };
  $('#lpw').onkeydown = e => { if (e.key === 'Enter') $('#unlock').click(); };

  const toNotes = () => {
    if (!w.notes.length) return toPhotos();
    const n = $('#notes'); n.innerHTML = '';
    w.notes.forEach((t, i) => { const d = document.createElement('div'); d.className = 'note'; d.style.animationDelay = i * .9 + 's'; d.textContent = t; n.append(d); });
    show('vNotes');
  };
  const toPhotos = () => {
    if (!photos.length) return toEnd();
    const g = $('#gal'); g.innerHTML = '';
    photos.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'pol';
      d.style.setProperty('--r', (Math.random() * 16 - 8).toFixed(1) + 'deg');
      d.style.animationDelay = i * .5 + 's'; d.style.marginTop = (Math.random() * 20) + 'px';
      const im = new Image(); im.src = p; d.append(im); g.append(d);
    });
    show('vPhotos');
  };
  const toEnd = () => {
    $('#endName').textContent = w.name || '';
    $('#endDate').textContent = w.date ? '📅 ' + new Date(w.date).toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    show('vEnd'); confetti();
  };
  $('#toNotes').onclick = toNotes; $('#toPhotos').onclick = toPhotos; $('#toEnd').onclick = toEnd; $('#replay').onclick = start;
  start();
}
function confetti() {
  const cols = ['#ff6ec4', '#ffd23f', '#7873f5', '#4ade80', '#38bdf8', '#fff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .8 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 6500);
  }
}
</script>
</body>
</html>
