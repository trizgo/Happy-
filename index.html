<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Wish 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',sans-serif;min-height:100vh;color:#fff;background:#150a2b;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(700px at 10% 10%,#6d28d955,transparent),radial-gradient(600px at 90% 90%,#be185d55,transparent),linear-gradient(160deg,#140a2e,#241044 55%,#34103f)}
.fl{position:fixed;z-index:0;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px #fff8;pointer-events:none;animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.08}to{opacity:.9}}
.orb{position:fixed;z-index:0;border-radius:50%;pointer-events:none;filter:blur(28px);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,-80px) scale(1.2)}}
.stage{display:none;position:relative;z-index:1;min-height:100vh;padding:22px 14px;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stage.on{display:flex;animation:fade .45s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.28);border-radius:24px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h2{font-family:'Pacifico',cursive;font-weight:400;text-shadow:0 4px 18px #f107a399}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font:inherit;outline:none}
select option{color:#222}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
input::placeholder,textarea::placeholder{color:#fff9}
label{display:block;text-align:left;font-size:14px;margin-top:12px;opacity:.9}
button{cursor:pointer;border:0;border-radius:30px;padding:12px 26px;font:600 16px 'Hind Siliguri';color:#fff;background:linear-gradient(135deg,#ff6ec4,#7873f5);box-shadow:0 8px 20px rgba(255,110,196,.4);margin:8px 4px;transition:.2s}
button:hover{transform:translateY(-2px) scale(1.04)}
button.sm{padding:6px 13px;font-size:13px;margin:2px}
button.alt{background:rgba(255,255,255,.2);box-shadow:none}
.err{color:#ffb3c1;min-height:18px;font-size:14px}
#admin .card,#adminLogin .card{max-width:560px;text-align:left}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #fff2;font-size:15px}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ph{position:relative}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.ph b{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#f43f5e;font-size:11px;line-height:20px;text-align:center;cursor:pointer}
.link{word-break:break-all;background:#0005;padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
/* cake */
.cake{display:flex;flex-direction:column;align-items:center;margin:8px 0}
.tier{border-radius:14px 14px 6px 6px;position:relative;opacity:0;transform:translateY(-300px);box-shadow:inset 0 -10px 0 #0002,0 6px 14px #0003;background-image:radial-gradient(circle,#fff 2px,transparent 3px),radial-gradient(circle,#ffe14d 2px,transparent 3px);background-size:26px 20px,34px 24px;background-position:4px 26px,14px 38px}
.tier::before{content:"";position:absolute;top:0;left:0;right:0;height:18px;border-radius:14px 14px 50% 50%/14px 14px 100% 100%;background:#fff;opacity:.95}
.t3{width:130px;height:48px;background-color:#ff8fb1}.t2{width:190px;height:58px;background-color:#c58bff}.t1{width:250px;height:68px;background-color:#ffb86b}
.plate{width:300px;height:14px;border-radius:50%;background:linear-gradient(#fff,#cfd0ee);opacity:0}
.build .tier{animation:drop .5s cubic-bezier(.3,1.4,.5,1) forwards}
.build .t1{animation-delay:.1s}.build .t2{animation-delay:.6s}.build .t3{animation-delay:1.1s}.build .plate{animation:fade .4s forwards}
@keyframes drop{to{opacity:1;transform:none}}
.candles{display:flex;gap:16px;height:72px;align-items:flex-end;justify-content:center}
.candle{width:10px;height:38px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,#ff6ec4 6px 12px);position:relative;cursor:pointer;animation:cdrop .45s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes cdrop{from{transform:translateY(-180px);opacity:0}}
.candle::before{content:"";position:absolute;inset:-18px -14px 0}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(#fff 10%,#ffd23f 45%,#ff7a00);box-shadow:0 0 18px 6px #ffb34777;animation:flick .25s infinite alternate;transform-origin:bottom}
@keyframes flick{to{transform:scale(1.1,.92) rotate(3deg)}}
.candle.off .flame{display:none}
.candle.off::after{content:"";position:absolute;left:50%;top:-10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff8;animation:smoke 1.4s forwards}
@keyframes smoke{to{transform:translateY(-60px) scale(5);opacity:0}}
/* letter */
.letter{position:relative;width:min(92vw,440px);min-height:250px;margin:14px 0 6px;padding:40px 28px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid #fff6;outline:1px solid #fff4;outline-offset:-10px;box-shadow:0 24px 60px #0008,inset 0 0 50px #ff6ec426;display:flex;align-items:center;justify-content:center;cursor:pointer}
.letter::before,.letter::after{position:absolute;font-size:60px;color:#ff9ed8;opacity:.55;font-family:serif;line-height:1}
.letter::before{content:"\201C";top:10px;left:16px}.letter::after{content:"\201D";bottom:-10px;right:16px}
.lt{font-size:24px;line-height:1.75;font-weight:600;white-space:pre-wrap;text-shadow:0 0 14px #ff6ec4cc,2px 2px 0 #7873f577,4px 4px 0 #0003}
/* photo pile */
.car{position:relative;width:min(92vw,400px);height:min(116vw,480px);margin:10px auto}
.slide{position:absolute;left:50%;top:50%;width:min(74vw,290px);aspect-ratio:3/4;padding:10px 10px 40px;background:#fff;border-radius:4px;box-shadow:0 16px 36px #000b;cursor:pointer;transform:translate(-50%,-190%) rotate(25deg);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.3,1.1),opacity .6s}
.slide img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.slide::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:#ffd1e6cc;transform:rotate(-3deg)}
.slide::after{content:"\2665";position:absolute;bottom:8px;right:14px;color:#ff6ec4;font-size:20px}
.conf{position:fixed;top:-30px;width:9px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.big{font-size:clamp(34px,9vw,60px);line-height:1.3}
.hint{opacity:.9;margin:8px;min-height:24px}
#doll{width:min(60vw,170px);transition:width .45s cubic-bezier(.3,1.6,.5,1);animation:bob 1.8s infinite alternate;filter:drop-shadow(0 14px 20px #0007)}
#doll svg{width:100%;display:block}
@keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
.resp{font-size:13px;padding:6px 10px;margin:2px 0 6px;background:#0003;border-radius:10px}
#yes{transition:.3s}
</style>
</head>
<body>

<!-- ===== ADMIN ===== -->
<div id="adminLogin" class="stage">
  <div class="card">
    <h2 style="font-size:32px;text-align:center">🔐 Admin Login</h2>
    <input id="em" type="email" placeholder="Email">
    <input id="pw" type="password" placeholder="Password">
    <div class="err" id="lerr"></div>
    <button id="loginBtn" style="width:100%">Login</button>
  </div>
</div>

<div id="admin" class="stage" style="justify-content:flex-start">
  <div class="card">
    <div class="row" style="border:0"><h2 style="font-size:26px" id="formTitle">🎂 New Wish</h2><button class="sm alt" id="logout">Logout</button></div>
    <label>Birthday person's name (optional)</label><input id="aName" placeholder="e.g. Riya">
    <label>Birthday date (optional)</label><input id="aDate" type="date">
    <label>Notes (one note per line — Bengali or English)</label><textarea id="aNotes" rows="5" placeholder="Happy Birthday! 🎉&#10;You are so special..."></textarea>
    <label>Photos <span id="pc"></span></label>
    <div class="prev" id="prev"></div>
    <button type="button" class="sm" id="addBtn">+ Add photos</button>
    <input id="aPhotos" type="file" accept="image/*" multiple hidden>
    <label>Lock password (optional)</label><input id="aPass" placeholder="Leave empty for no lock">
    <label id="rmWrap" style="display:none"><input type="checkbox" id="rmPw">Remove existing password</label>
    <label>Final surprise</label>
    <select id="aMode"><option value="none">None</option><option value="sorry">Sorry 🥺</option><option value="love">I Love You ❤️</option></select>
    <input id="aQ" placeholder="Custom question (optional) e.g. Will you forgive me?">
    <div class="err" id="aerr"></div>
    <button id="save">✨ Create link</button><button class="alt" id="cancel" style="display:none">Cancel edit</button>
    <div id="result"></div>
    <h3 style="margin-top:22px">Your wishes</h3>
    <div id="list"></div>
  </div>
</div>

<!-- ===== VIEWER ===== -->
<div id="vLoad" class="stage"><h2 style="font-size:34px">🎁 Loading...</h2></div>
<div id="vErr" class="stage"><h2 style="font-size:30px">😕 Link not found</h2></div>

<div id="vCake" class="stage">
  <h2 id="vTitle" class="big" style="margin-bottom:6px"></h2>
  <div class="cake" id="cake">
    <div class="candles" id="candles"></div>
    <div class="tier t3"></div><div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="card" id="lock" style="display:none;max-width:340px">
    <div style="font-size:20px">🔒 Enter password</div>
    <input id="lpw" type="password" placeholder="Password">
    <div class="err" id="lock-err"></div>
    <button id="unlock">Unlock</button>
  </div>
  <button id="toNotes" style="display:none">Next ➜</button>
</div>

<div id="vNotes" class="stage"><h2 style="font-size:32px;margin-bottom:6px">💌 A few words for you</h2><div class="letter" id="letter"><div class="lt" id="lt"></div></div><div class="hint">Tap the card to skip ahead</div><button id="toPhotos" style="visibility:hidden">Next ➜</button></div>

<div id="vPhotos" class="stage"><h2 style="font-size:32px">📸 Sweet Memories</h2><div class="car" id="car"></div><div class="hint">Tap a photo to flip to the next one</div><button id="toAsk">Next ➜</button></div>

<div id="vAsk" class="stage">
  <div class="card" style="max-width:360px;margin-bottom:14px"><div id="bubble" style="font-size:22px;font-weight:600"></div></div>
  <div id="doll"><svg viewBox="0 0 200 232">
<g fill="#fff" stroke="#e0d8f0" stroke-width="3"><circle cx="55" cy="42" r="26"/><circle cx="145" cy="42" r="26"/><ellipse cx="72" cy="215" rx="23" ry="14"/><ellipse cx="128" cy="215" rx="23" ry="14"/><ellipse cx="100" cy="165" rx="52" ry="55"/><ellipse cx="40" cy="158" rx="17" ry="31" transform="rotate(25 40 158)"/><ellipse cx="160" cy="158" rx="17" ry="31" transform="rotate(-25 160 158)"/><circle cx="100" cy="85" r="52"/></g>
<circle cx="55" cy="42" r="13" fill="#ffd9e8"/><circle cx="145" cy="42" r="13" fill="#ffd9e8"/>
<ellipse cx="100" cy="172" rx="30" ry="34" fill="#fff0f7"/><path d="M100 192C82 178 90 160 100 171C110 160 118 178 100 192Z" fill="#ff4d8d"/>
<ellipse cx="100" cy="102" rx="23" ry="17" fill="#fff0f7" stroke="#e0d8f0" stroke-width="2"/>
<circle cx="78" cy="78" r="7" fill="#3b2a4d"/><circle cx="122" cy="78" r="7" fill="#3b2a4d"/><circle cx="80" cy="75" r="2.5" fill="#fff"/><circle cx="124" cy="75" r="2.5" fill="#fff"/>
<ellipse cx="100" cy="94" rx="7" ry="5" fill="#3b2a4d"/><path id="mouth" d="M91 106 Q100 113 109 106" stroke="#3b2a4d" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="60" cy="96" r="8" fill="#ffb3d1" opacity=".75"/><circle cx="140" cy="96" r="8" fill="#ffb3d1" opacity=".75"/>
<g id="tears" style="display:none"><path d="M76 86q-6 13 0 17q6-4 0-17z" fill="#7dd3fc"/><path d="M124 86q6 13 0 17q-6-4 0-17z" fill="#7dd3fc"/></g></svg></div>
  <div style="margin-top:18px"><button id="yes">Yes 💖</button><button id="no" class="alt">No</button></div>
</div>

<div id="vEnd" class="stage">
  <div class="big" style="font-family:Pacifico">Happy Birthday</div>
  <div class="big" id="endName" style="margin:8px 0;font-family:Pacifico"></div>
  <div id="endDate" style="font-size:20px"></div>
  <div id="endMsg" style="font-size:24px;margin-top:12px;font-weight:600"></div>
  <div style="font-size:60px;margin-top:12px">🎂🎉💖</div>
  <button id="replay">🔁 Watch again</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, addDoc, deleteDoc, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBXTX7h1kKT7B5HSzbhKSqwyqfD8tZ76f8",
  authDomain: "happy-1f92d.firebaseapp.com",
  projectId: "happy-1f92d",
  storageBucket: "happy-1f92d.firebasestorage.app",
  messagingSenderId: "951183033864",
  appId: "1:951183033864:web:ae7afe42a406518fb8f3bd"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const show = id => { document.querySelectorAll('.stage').forEach(e => e.classList.remove('on')); $('#' + id).classList.add('on'); scrollTo(0, 0); };
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
const baseLink = id => location.origin + location.pathname + '?w=' + id;
const photoDocs = async id => (await getDocs(collection(db, 'wishes', id, 'photos'))).docs;

// soft twinkling background
for (let i = 0; i < 46; i++) { const d = document.createElement('div'); d.className = 'fl'; const z = 1.5 + Math.random() * 3;
  d.style.cssText = `left:${Math.random() * 100}vw;top:${Math.random() * 100}vh;width:${z}px;height:${z}px;animation-duration:${2 + Math.random() * 4}s;animation-delay:${-Math.random() * 5}s`; document.body.append(d); }
['#ff6ec455', '#7873f555', '#c58bff55', '#38bdf833', '#ffb86b33'].forEach(c => { const d = document.createElement('div'); d.className = 'orb'; const z = 140 + Math.random() * 160;
  d.style.cssText = `left:${Math.random() * 90}vw;top:${Math.random() * 90}vh;width:${z}px;height:${z}px;animation-delay:${-Math.random() * 18}s;background:radial-gradient(circle,${c},transparent 70%)`; document.body.append(d); });

const wid = new URLSearchParams(location.search).get('w');
if (wid) viewer(wid); else adminInit();

/* ================= ADMIN ================= */
function adminInit() {
  show('adminLogin');
  let photos = [], editId = null, cur = {};
  onAuthStateChanged(auth, u => { if (u) { show('admin'); loadList(); } else show('adminLogin'); });
  $('#loginBtn').onclick = async () => {
    $('#lerr').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
    catch (e) { $('#lerr').textContent = 'Wrong email or password!'; }
  };
  $('#logout').onclick = () => signOut(auth);

  const renderPrev = () => {
    $('#prev').innerHTML = '';
    photos.forEach((p, i) => {
      const w = document.createElement('div'); w.className = 'ph';
      const im = new Image(); im.src = p; const x = document.createElement('b'); x.textContent = '✕';
      x.onclick = () => { photos.splice(i, 1); renderPrev(); }; w.append(im, x); $('#prev').append(w);
    });
    $('#pc').textContent = photos.length ? '(' + photos.length + ' selected)' : '';
  };
  $('#addBtn').onclick = () => $('#aPhotos').click();
  $('#aPhotos').onchange = async e => {
    const fs = [...e.target.files]; e.target.value = '';
    photos.push(...await Promise.all(fs.map(resize))); renderPrev();
  };
  const clearForm = () => {
    ['aName', 'aDate', 'aNotes', 'aPass', 'aQ'].forEach(i => $('#' + i).value = '');
    $('#aMode').value = 'none'; $('#rmPw').checked = false; $('#rmWrap').style.display = 'none';
    photos = []; renderPrev(); editId = null; cur = {};
    $('#formTitle').textContent = '🎂 New Wish'; $('#save').textContent = '✨ Create link'; $('#cancel').style.display = 'none';
  };
  $('#cancel').onclick = clearForm;

  $('#save').onclick = async () => {
    const btn = $('#save'); $('#aerr').textContent = '';
    const notes = $('#aNotes').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!notes.length && !photos.length) { $('#aerr').textContent = 'Add at least one note or photo.'; return; }
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const id = editId || [...crypto.getRandomValues(new Uint8Array(6))].map(b => (b % 36).toString(36)).join('');
      const pass = $('#aPass').value.trim();
      let pwHash = cur.pwHash || '';
      if (pass) pwHash = await sha(pass); else if ($('#rmPw').checked) pwHash = '';
      await setDoc(doc(db, 'wishes', id), {
        name: $('#aName').value.trim(), date: $('#aDate').value, notes, pwHash,
        mode: $('#aMode').value, q: $('#aQ').value.trim(), createdAt: cur.createdAt || Date.now()
      });
      if (editId) await Promise.all((await photoDocs(id)).map(d => deleteDoc(d.ref)));
      await Promise.all(photos.map((data, i) => addDoc(collection(db, 'wishes', id, 'photos'), { data, i })));
      $('#result').innerHTML = '<div class="link" id="lk"></div><button class="sm" id="cp">📋 Copy link</button>';
      $('#lk').textContent = baseLink(id);
      $('#cp').onclick = () => { navigator.clipboard.writeText(baseLink(id)); $('#cp').textContent = '✅ Copied'; };
      clearForm(); loadList();
    } catch (e) { $('#aerr').textContent = 'Error: ' + e.message; }
    btn.disabled = false; btn.textContent = editId ? '💾 Save changes' : '✨ Create link';
  };

  async function startEdit(id, w) {
    clearForm(); editId = id; cur = w;
    $('#aName').value = w.name || ''; $('#aDate').value = w.date || ''; $('#aNotes').value = (w.notes || []).join('\n');
    $('#aMode').value = w.mode || 'none'; $('#aQ').value = w.q || '';
    $('#aPass').placeholder = w.pwHash ? 'Leave empty to keep current password' : 'Leave empty for no lock';
    $('#rmWrap').style.display = w.pwHash ? 'block' : 'none';
    $('#formTitle').textContent = '✏️ Edit Wish'; $('#save').textContent = '💾 Save changes'; $('#cancel').style.display = 'inline-block';
    scrollTo({ top: 0, behavior: 'smooth' });
    photos = (await photoDocs(id)).map(d => d.data()).sort((a, b) => a.i - b.i).map(p => p.data); renderPrev();
  }
  async function loadList() {
    const l = $('#list'); l.innerHTML = '';
    const snap = await getDocs(query(collection(db, 'wishes'), orderBy('createdAt', 'desc')));
    snap.forEach(d => {
      const w = d.data(), r = document.createElement('div'); r.className = 'row';
      const t = document.createElement('span');
      t.textContent = (w.name || 'Unnamed') + (w.pwHash ? ' 🔒' : '') + (w.mode === 'sorry' ? ' 🥺' : w.mode === 'love' ? ' ❤️' : '');
      const b = document.createElement('span');
      const mk = (txt, fn) => { const x = document.createElement('button'); x.className = 'sm'; x.textContent = txt; x.onclick = () => fn(x); b.append(x); };
      mk('Link', x => { navigator.clipboard.writeText(baseLink(d.id)); x.textContent = '✅'; });
      mk('Edit', () => startEdit(d.id, w));
      mk('🗑', async () => {
        if (!confirm('Delete this wish?')) return;
        await Promise.all([...await photoDocs(d.id), ...(await getDocs(collection(db, 'wishes', d.id, 'responses'))).docs].map(p => deleteDoc(p.ref))); await deleteDoc(d.ref); loadList();
      });
      r.append(t, b); l.append(r);
      if (w.mode && w.mode !== 'none') {
        const x = document.createElement('div'); x.className = 'resp'; x.textContent = '⏳ Not answered yet'; l.append(x);
        getDocs(collection(db, 'wishes', d.id, 'responses')).then(sn => {
          const a = sn.docs.map(q => q.data()).sort((p, q) => q.at - p.at); if (!a.length) return;
          const y = a.find(v => v.answer === 'yes'), v = y || a[0], lab = w.mode === 'sorry' ? 'Sorry 🥺' : 'I Love You ❤️';
          const when = new Date(v.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
          x.textContent = y ? `✅ ${lab}: said YES after ${y.nos} No click${y.nos === 1 ? '' : 's'} — ${when}` : `🤔 ${lab}: clicked No ${v.nos} time${v.nos === 1 ? '' : 's'}, no Yes yet — ${when}`;
        }).catch(() => {});
      }
    });
  }
}
function resize(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, 720 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .7)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* ================= VIEWER ================= */
async function viewer(id) {
  show('vLoad');
  let w, photos = [];
  try {
    const [s, ps] = await Promise.all([getDoc(doc(db, 'wishes', id)), photoDocs(id)]);
    if (!s.exists()) return show('vErr');
    w = s.data(); photos = ps.map(d => d.data()).sort((a, b) => a.i - b.i).map(p => p.data);
  } catch (e) { return show('vErr'); }
  let timer, nos = 0, sid = '', order = [], Q = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const chars = t => window.Intl && Intl.Segmenter ? [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(t)].map(x => x.segment) : Array.from(t);

  const start = () => {
    clearInterval(timer);
    $('#vTitle').textContent = w.name ? '🎂 ' + w.name : '';
    $('#candles').innerHTML = ''; $('#hint').textContent = '';
    $('#lock').style.display = 'none'; $('#toNotes').style.display = 'none';
    const cake = $('#cake'); cake.classList.remove('build'); void cake.offsetWidth; cake.classList.add('build');
    show('vCake');
    setTimeout(() => w.pwHash ? ($('#lock').style.display = 'block') : candles(), 1700);
  };
  const candles = () => {
    const box = $('#candles'); let left = 5;
    $('#hint').textContent = '🕯️ Tap the candles to blow them out';
    for (let i = 0; i < 5; i++) {
      const c = document.createElement('div'); c.className = 'candle'; c.style.animationDelay = i * .08 + 's';
      c.innerHTML = '<div class="flame"></div>';
      c.onclick = () => {
        if (c.classList.contains('off')) return; c.classList.add('off');
        if (--left === 0) { $('#hint').textContent = '🎉 Happy Birthday! 🎉'; confetti(); $('#toNotes').style.display = 'inline-block'; }
      };
      box.append(c);
    }
  };
  $('#unlock').onclick = async () => {
    if (await sha($('#lpw').value.trim()) === w.pwHash) { $('#lock').style.display = 'none'; candles(); }
    else $('#lock-err').textContent = 'Wrong password, try again';
  };
  $('#lpw').onkeydown = e => { if (e.key === 'Enter') $('#unlock').click(); };

  const toNotes = () => {
    if (!w.notes.length) return toPhotos();
    const lt = $('#lt'), nb = $('#toPhotos'); let ni = 0, ci = 0, tm, cs = [], busy = false;
    nb.style.visibility = 'hidden'; lt.style.transition = 'opacity .35s'; show('vNotes');
    const load = () => { busy = false; cs = chars(w.notes[ni]); ci = 0; lt.style.opacity = 1; type(); };
    const type = () => { lt.textContent = cs.slice(0, ++ci).join(''); tm = setTimeout(ci < cs.length ? type : next, ci < cs.length ? (cs.length > 120 ? 15 : 38) : 1800); };
    const next = () => { if (++ni >= w.notes.length) { nb.style.visibility = 'visible'; return; } busy = true; lt.style.opacity = 0; tm = setTimeout(load, 350); };
    $('#letter').onclick = () => { if (busy || ni >= w.notes.length) return; clearTimeout(tm); if (ci < cs.length) { ci = cs.length; lt.textContent = cs.join(''); tm = setTimeout(next, 1100); } else next(); };
    load();
  };
  const place = () => {
    const n = photos.length;
    [...$('#car').children].forEach(el => {
      const i = +el.dataset.i, k = order.indexOf(i), q = Q[i];
      el.style.zIndex = n - k; el.style.opacity = k > 3 ? 0 : 1;
      el.style.transform = `translate(-50%,-50%) translate(${q.x}px,${q.y}px) rotate(${k ? q.r : q.r / 2}deg) scale(${k ? 1 : 1.03})`;
    });
  };
  let flying = false;
  const flick = () => {
    if (photos.length < 2 || flying) return; flying = true;
    const top = $('#car').children[order[0]], dir = Math.random() < .5 ? -1 : 1;
    top.style.transform = `translate(-50%,-50%) translate(${dir * 125}%,-40px) rotate(${dir * 30}deg)`; top.style.opacity = 0;
    setTimeout(() => { order.push(order.shift()); top.style.transition = 'none'; place(); void top.offsetWidth; top.style.transition = ''; flying = false; }, 700);
  };
  const toPhotos = () => {
    if (!photos.length) return toAsk();
    const car = $('#car'); car.innerHTML = ''; flying = false; order = photos.map((_, i) => i);
    Q = photos.map(() => ({ x: rnd(-24, 24), y: rnd(-22, 22), r: rnd(-11, 11) }));
    photos.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'slide'; d.dataset.i = i; const im = new Image(); im.src = p; d.append(im);
      d.onclick = () => { clearInterval(timer); flick(); timer = setInterval(flick, 2800); }; car.append(d);
    });
    show('vPhotos'); requestAnimationFrame(() => requestAnimationFrame(place));
    clearInterval(timer); timer = setInterval(flick, 2800);
  };

  const nosTxt = ['Are you sure? 🥺', 'Please... 😢', 'Pretty please? 🥹', 'I will be so sad... 😭', 'Last chance, please? 💔'];
  const log = a => setDoc(doc(db, 'wishes', id, 'responses', sid), { mode: w.mode, nos, answer: a || '', at: Date.now() }).catch(() => {});
  const sad = () => { const sd = nos >= 2; $('#tears').style.display = sd ? '' : 'none'; $('#mouth').setAttribute('d', sd ? 'M90 111 Q100 102 110 111' : 'M91 106 Q100 113 109 106'); };
  const toAsk = () => {
    clearInterval(timer);
    if (!w.mode || w.mode === 'none') return toEnd();
    nos = 0; sid = Math.random().toString(36).slice(2, 10); sad();
    $('#doll').style.width = ''; $('#no').style.display = ''; $('#yes').style.fontSize = '';
    $('#bubble').textContent = w.q || (w.mode === 'sorry' ? 'Will you forgive me? 🥺' : 'I love you ❤️ Do you love me too?');
    show('vAsk');
  };
  $('#no').onclick = () => {
    nos++; sad(); $('#doll').style.width = `min(88vw,${170 + nos * 40}px)`; log();
    if (nos >= 5) { $('#no').style.display = 'none'; $('#bubble').textContent = 'Okay, you can only press Yes now 😤💖'; $('#yes').style.fontSize = '26px'; }
    else $('#bubble').textContent = nosTxt[nos - 1];
  };
  $('#yes').onclick = () => { log('yes'); confetti('💖'); toEnd(w.mode === 'sorry' ? 'Thank you for forgiving me 🥹💖' : 'You just made my day 💖'); };

  const toEnd = (msg) => {
    clearInterval(timer);
    $('#endName').textContent = w.name || '';
    $('#endDate').textContent = w.date ? '📅 ' + new Date(w.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    $('#endMsg').textContent = typeof msg === 'string' ? msg : '';
    show('vEnd'); confetti();
  };
  $('#toNotes').onclick = toNotes; $('#toPhotos').onclick = toPhotos; $('#toAsk').onclick = toAsk; $('#replay').onclick = start;
  start();
}
function confetti(emoji) {
  const cols = ['#ff6ec4', '#ffd23f', '#7873f5', '#4ade80', '#38bdf8', '#fff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    if (emoji) { c.textContent = emoji; c.style.fontSize = 14 + Math.random() * 20 + 'px'; c.style.width = 'auto'; c.style.height = 'auto'; }
    else c.style.background = cols[i % cols.length];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 5600);
  }
}
